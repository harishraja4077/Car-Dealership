<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Stackly</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b0d10'/><circle cx='50' cy='50' r='44' fill='none' stroke='%23c9a44c' stroke-width='7'/><circle cx='50' cy='50' r='15' fill='%23c9a44c'/><rect x='46' y='10' width='8' height='30' rx='4' fill='%23c9a44c'/><rect x='46' y='60' width='8' height='30' rx='4' fill='%23c9a44c'/><rect x='10' y='46' width='30' height='8' rx='4' fill='%23c9a44c'/><rect x='60' y='46' width='30' height='8' rx='4' fill='%23c9a44c'/></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="error-page">

  <!-- Preloader -->
  <div class="loader">
    <div class="loader-logo gold-text">STACKLY</div>
    <div class="loader-bar"></div>
  </div>

  <!-- Custom Cursor -->
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <!-- NAVIGATION -->
  <nav class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="logo logo-img">
        <img src="Assets/logo.webp" alt="Stackly">
      </a>
      
      <button class="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div class="mobile-menu">
    <a href="index.html">Home</a>
    <a href="blog.html">Blog</a>
    <a href="services.html">Services</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="signin.html" class="btn btn-gold mobile-menu-cta">Sign In</a>
  </div>

  <!-- 404  -->
  <main class="not-found-main">
    <div class="not-found-orb not-found-orb-1"></div>
    <div class="not-found-orb not-found-orb-2"></div>

    <div class="not-found-road">
      <span class="not-found-road-line"></span>
      <i class="fas fa-car not-found-car"></i>
    </div>

    <div class="not-found-content">
      <div class="not-found-code">
        <span class="not-found-digit">4</span>
        <span class="not-found-wheel-outer">
          <span class="not-found-wheel">
            <i class="fas fa-steering-wheel"></i>
          </span>
        </span>
        <span class="not-found-digit">4</span>
      </div>

      <div class="not-found-badge">
        <span class="section-tag">Error 404</span>
        <h1>Looks Like <span class="gold-text">Lost Your Way</span></h1>
        <p>The page you're searching for has been parked in the wrong garage. Let's get you back on the road.</p>
        <div class="not-found-actions">
          <a href="index.html" class="btn btn-gold">Back To Home</a>
          <button type="button" class="btn btn-outline" onclick="history.back()"><i class="fas fa-arrow-left"></i> Go Back</button>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
